<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>进化演出预览 · 宝可梦幸存者</title>
  <style>
    @font-face{font-family:FusionPixel;src:url('../../assets/fonts/fusion-pixel/fusion-pixel-12px-proportional-zh_hans.otf.woff2') format('woff2');font-display:swap}
    :root{color-scheme:light;--ink:#342a3d;--ink2:#51465d;--cream:#fff8e8;--cream2:#f8efd9;--line:#d9cbaa;--grass:#e8efd4;--grass-deep:#dbe8c1;--gold:#f2bd52;--gold2:#ffe69b;--violet:#9672ca;--mint:#9ddaba}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#ddd6c8;color:var(--ink);font-family:FusionPixel,"Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}
    button{font:inherit;color:inherit}
    .shell{width:min(1040px,100%);background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 #b8ad99,0 22px 60px #2f25351c;overflow:hidden}
    .topbar{min-height:76px;background:var(--ink);color:#fff3d4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;border-bottom:4px solid var(--gold)}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;border:3px solid #fff0c4;border-radius:50%;background:linear-gradient(180deg,#f4c74d 0 48%,#fff8e8 49% 56%,#ed7664 57%);position:relative;box-shadow:inset 0 0 0 3px #3b3043}.brand-mark:after{content:"";position:absolute;width:10px;height:10px;left:12px;top:12px;border:3px solid var(--ink);border-radius:50%;background:white}
    .eyebrow{font:700 10px/1.2 system-ui,sans-serif;letter-spacing:.16em;color:#d1bfeb;text-transform:uppercase}.brand h1{font-size:20px;line-height:1;margin:5px 0 0;color:#fff8e8}.top-actions{display:flex;align-items:center;gap:9px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #796887;border-radius:999px;color:#e4d9ee;font-size:11px;white-space:nowrap}.live-dot{width:7px;height:7px;background:#89d6a9;border-radius:50%;box-shadow:0 0 0 3px #89d6a926}
    .content{padding:20px 22px 22px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 2px 14px}.intro h2{margin:0;font-size:17px}.intro p{margin:5px 0 0;color:#756b70;font:12px/1.55 system-ui,sans-serif}.phase-chip{background:#f0e7d1;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:#756b70;font-size:11px;white-space:nowrap}.phase-chip strong{color:var(--ink)}
    .stage{position:relative;overflow:hidden;border:2px solid #6b5a6d;border-radius:16px;background:var(--grass);box-shadow:inset 0 2px 0 #fff9e5}
    canvas{display:block;width:100%;height:auto;aspect-ratio:1000/430;image-rendering:pixelated}
    .hud{position:absolute;left:14px;top:13px;display:flex;gap:10px;pointer-events:none}.hud-card{display:flex;align-items:center;gap:9px;background:var(--cream);border:2px solid #716477;border-radius:11px;padding:7px 11px;box-shadow:0 3px 0 #c6b99e;color:#473b49}.party{min-width:176px}.party-face{width:30px;height:30px;display:grid;place-items:center;background:#eee8d8;border:1px solid #d5c8ae;border-radius:8px;overflow:hidden}.party-face img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}.hud-copy{font-size:10px;line-height:1.5}.hud-copy b{font-size:11px}.xp{min-width:164px;display:block;padding:7px 11px}.xp-top{display:flex;justify-content:space-between;font-size:10px}.xp-bar{display:block;height:6px;margin-top:6px;border:1px solid #a59a81;border-radius:4px;background:#e7dfcc;overflow:hidden}.xp-bar i{display:block;width:45%;height:100%;background:#83c6df;border-right:2px solid #fff}
    .badge{position:absolute;right:14px;top:14px;border:1px solid #9b85bf;border-radius:999px;padding:7px 11px;background:#f8f0ffed;color:#674d92;font-size:10px;box-shadow:0 2px 0 #d9c8ee}
    .callout{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:9px 14px;background:#342a3dec;border:2px solid #fff3d2;border-radius:13px;color:#fff8e8;box-shadow:0 3px 0 #ad946a;white-space:nowrap;pointer-events:none;font-size:12px;opacity:0;transition:opacity .2s,transform .2s}.callout.show{opacity:1;transform:translate(-50%,-3px)}.callout .star{color:#ffd970;font-size:15px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px}.stage-select,.actions{display:flex;align-items:center;gap:8px}.control-label{font-size:10px;color:#80756e;margin-right:2px}.seg button,.mode button,.replay{border:1px solid #cdbfa6;border-radius:9px;background:#fffaf0;padding:8px 11px;font-size:11px;cursor:pointer;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.seg button:hover,.mode button:hover,.replay:hover{transform:translateY(-1px)}.seg button[aria-pressed=true],.mode button[aria-pressed=true]{background:#e9dcf7;border-color:#9672ca;color:#583f80;box-shadow:inset 0 -2px #c0a6df}.replay{border-color:#63536f;background:var(--ink);color:#fff4d7;box-shadow:0 3px 0 #b9a78b;padding-inline:15px}.replay:active{transform:translateY(2px);box-shadow:0 1px 0 #b9a78b}.notes{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 0;color:#81766e;font:11px/1.5 system-ui,sans-serif}.notes strong{color:#55485a}.sound-note{display:flex;align-items:center;gap:6px;white-space:nowrap}.mute{width:18px;height:18px;border:1px solid #c9b99d;border-radius:50%;display:inline-grid;place-items:center;color:#806a9b;font-size:10px;background:#fff8e8}
    .sound-toggle{border:1px solid #cdbfa6;border-radius:9px;background:#fffaf0;padding:8px 11px;font-size:11px;cursor:pointer;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.sound-toggle:hover{transform:translateY(-1px)}.sound-toggle[aria-pressed=true]{background:#e2f0d6;border-color:#8eb67b;color:#3b6645;box-shadow:inset 0 -2px #b8d5a8}
    @media(max-width:720px){body{padding:10px}.shell{border-radius:14px}.topbar{padding:11px 13px;min-height:65px}.brand-mark{width:34px;height:34px}.brand-mark:after{left:9px;top:9px}.brand h1{font-size:16px}.pill{font-size:9px;padding:6px 8px}.content{padding:15px 12px}.intro{align-items:flex-start;flex-direction:column;gap:8px}.intro h2{font-size:15px}.phase-chip{padding:6px 8px}.hud{left:7px;top:7px;gap:5px}.hud-card{padding:5px 7px;border-width:1px;border-radius:8px;gap:5px}.party{min-width:0}.party-face{width:23px;height:23px}.party-face img{width:34px;height:34px}.hud-copy,.xp-top{font-size:8px}.hud-copy b{font-size:9px}.xp{min-width:112px}.xp-bar{height:5px;margin-top:3px}.badge{right:7px;top:7px;padding:5px 7px;font-size:8px}.callout{bottom:9px;font-size:9px;padding:6px 9px}.toolbar{align-items:flex-start;flex-direction:column}.stage-select,.actions{flex-wrap:wrap}.seg button,.mode button,.replay{padding:7px 9px;font-size:10px}.notes{align-items:flex-start;flex-direction:column}.sound-note{white-space:normal}}
    @media(max-width:720px){.sound-toggle{padding:7px 9px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><div class="eyebrow">FIELD VFX PREVIEW</div><h1>进化演出</h1></div></div>
      <div class="top-actions"><span class="pill"><i class="live-dot"></i>像素动画概念稿</span></div>
    </header>
    <section class="content">
      <div class="intro"><div><h2>集光洗白，空中蜕变</h2><p>原形态化作白色剪影，翻转中融合为进化形态，落地后显现颜色。</p></div><div class="phase-chip">当前阶段 <strong id="phaseName">光效聚集</strong></div></div>
      <div class="stage">
        <canvas id="scene" width="1000" height="430" aria-label="宝可梦精灵进化特效预览"></canvas>
        <div class="hud">
          <div class="hud-card party"><span class="party-face"><img id="partyImg" src="../../assets/icons/BULBASAUR.png" alt="" /></span><span class="hud-copy"><b>队伍 3 / 12</b><br><span id="partyName">妙蛙种子</span> · 伙伴</span></div>
          <div class="hud-card xp"><div class="xp-top"><span>Lv 12</span><span>EXP 3 / 5</span></div><span class="xp-bar"><i></i></span></div>
        </div>
        <div class="badge">✦ 进化条件已满足</div>
        <div class="callout" id="callout"><span class="star">✦</span><span id="calloutText">全新的伙伴登场！</span></div>
      </div>
      <div class="toolbar">
        <div class="stage-select"><span class="control-label">演示家族</span><div class="seg" role="group" aria-label="演示家族"><button data-family="bulba" aria-pressed="true">妙蛙种子系</button><button data-family="charmander" aria-pressed="false">小火龙系</button></div></div>
        <div class="actions"><span class="control-label">演出节奏</span><div class="mode" role="group" aria-label="演出节奏"><button data-mode="manual" aria-pressed="true">手动进化</button><button data-mode="auto" aria-pressed="false">自动进化</button></div><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">♫ 音效：关</button><button class="replay" id="replay">↻ 重新播放</button></div>
      </div>
      <div class="notes"><span><strong>节奏：</strong>光效聚集并洗白 → 空中翻转、白色剪影蜕变 → 落地后恢复颜色</span><span class="sound-note"><i class="mute">♪</i><span id="soundStatus">默认静音；开启音效后从头试听</span></span></div>
    </section>
  </main>
  <script>
    (()=>{
      const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
      const phaseName=document.getElementById('phaseName'),callout=document.getElementById('callout'),calloutText=document.getElementById('calloutText');
      const partyImg=document.getElementById('partyImg'),partyName=document.getElementById('partyName');
      const soundToggle=document.getElementById('soundToggle'),soundStatus=document.getElementById('soundStatus');
      const families={
        bulba:{from:'BULBASAUR',to:'IVYSAUR',fromName:'妙蛙种子',toName:'妙蛙草',color:'#9bcf65',accent:'#8d6ac0'},
        charmander:{from:'CHARMANDER',to:'CHARMELEON',fromName:'小火龙',toName:'火恐龙',color:'#ff9b55',accent:'#e87961'}
      };
      const soundParams=new URLSearchParams(location.search);
      let family=families.bulba,mode='manual',restartAt=performance.now(),soundMuted=soundParams.get('mute')==='1'||soundParams.get('sound')!=='1',audioContext=null,sfxBus=null,audioRun=0,audioCycleKey='',audioPlayed=new Set();
      const imageCache=new Map();
      function sprite(name){
        if(imageCache.has(name))return imageCache.get(name);
        const img=new Image();img.src=`../../assets/icons/${name}.png`;
        const entry={img,canvas:null,ready:false};imageCache.set(name,entry);
        img.onload=()=>{
          const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d',{willReadFrequently:true});
          x.drawImage(img,0,0,128,64);const px=x.getImageData(0,0,64,64).data;let x0=64,y0=64,x1=-1,y1=-1;
          for(let y=0;y<64;y++)for(let xx=0;xx<64;xx++)if(px[(y*64+xx)*4+3]>12){x0=Math.min(x0,xx);x1=Math.max(x1,xx);y0=Math.min(y0,y);y1=Math.max(y1,y)}
          if(x1>=x0){const w=x1-x0+1,h=y1-y0+1,pad=4,d=document.createElement('canvas');d.width=w+pad*2;d.height=h+pad*2;d.getContext('2d').drawImage(c,x0,y0,w,h,pad,pad,w,h);entry.canvas=d;entry.silhouette=document.createElement('canvas');entry.silhouette.width=d.width;entry.silhouette.height=d.height;const sc=entry.silhouette.getContext('2d');sc.drawImage(d,0,0);sc.globalCompositeOperation='source-in';sc.fillStyle='#fffef2';sc.fillRect(0,0,d.width,d.height);entry.ready=true;if(family.from===name)partyImg.src=d.toDataURL()}
        };
        return entry;
      }
      function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}function ease(v){v=clamp(v);return 1-Math.pow(1-v,3)}
      function syncSoundUi(){soundToggle.setAttribute('aria-pressed',String(!soundMuted));soundToggle.textContent=soundMuted?'♫ 音效：关':'♫ 音效：开';soundStatus.textContent=soundMuted?'默认静音；开启音效后从头试听':'音效已开启；可随时关闭'}
      function prepareAudio(){const AudioAPI=window.AudioContext||window.webkitAudioContext;if(!AudioAPI)return false;try{if(!audioContext){audioContext=new AudioAPI();sfxBus=audioContext.createGain();sfxBus.gain.value=soundMuted ? .0001 : .32;sfxBus.connect(audioContext.destination)}sfxBus.gain.setTargetAtTime(soundMuted ? .0001 : .32,audioContext.currentTime,.025);if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return true}catch{return false}}
      function playTone(type,fromHz,toHz,duration,volume,delay=0){if(soundMuted||!audioContext||audioContext.state!=='running')return;const start=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(fromHz,start);osc.frequency.exponentialRampToValueAtTime(toHz,start+duration);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(sfxBus);osc.start(start);osc.stop(start+duration+.02)}
      function playNoise(duration,volume,low,high){if(soundMuted||!audioContext||audioContext.state!=='running')return;const start=audioContext.currentTime,frames=Math.max(1,Math.floor(audioContext.sampleRate*duration)),buffer=audioContext.createBuffer(1,frames,audioContext.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<frames;i++)data[i]=Math.random()*2-1;const source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.setValueAtTime(high,start);filter.frequency.exponentialRampToValueAtTime(low,start+duration);filter.Q.value=.7;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);source.connect(filter);filter.connect(gain);gain.connect(sfxBus);source.start(start);source.stop(start+duration+.02)}
      function playCharge(){playTone('sine',196,740,.92,.16);playTone('triangle',392,1174,.60,.07,.16)}
      function playFlip(){playNoise(.38,.16,420,2200);playTone('triangle',820,270,.34,.08)}
      function playMorph(){[[660,0],[880,.10],[1175,.20],[1568,.30]].forEach(([hz,delay])=>playTone('sine',hz,hz*.82,.24,.075,delay))}
      function playLanding(){playTone('triangle',132,58,.20,.24);playTone('sine',523,784,.16,.075,.035)}
      function updateAudio(t,visual,loop){if(soundMuted||!audioContext||audioContext.state!=='running')return;const cycleKey=`${audioRun}:${Math.floor(t/loop)}`;if(cycleKey!==audioCycleKey){audioCycleKey=cycleKey;audioPlayed.clear();playCharge()}[[.28,'flip',playFlip],[.38,'morph',playMorph],[.89,'landing',playLanding]].forEach(([at,name,play])=>{if(visual>=at&&!audioPlayed.has(name)){audioPlayed.add(name);play()}})}
      function restartAnimation(fromGesture=false){restartAt=performance.now();audioRun++;audioCycleKey='';audioPlayed.clear();callout.classList.remove('show');if(fromGesture&&!soundMuted)prepareAudio()}
      function rnd(seed){let t=seed+0x6D2B79F5;return()=>{t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
      const stars=Array.from({length:54},(_,i)=>{const r=rnd(i*817+23);return{x:r()*1000,y:r()*430,s:1+r()*2,a:.12+r()*.25,phase:r()*6.28}});
      const grass=Array.from({length:29},(_,i)=>{const r=rnd(i*991+101);return{x:30+r()*940,y:55+r()*325,h:5+r()*7,lean:(r()-.5)*6,shade:i%3}});
      function background(t){
        const g=ctx.createLinearGradient(0,0,850,430);g.addColorStop(0,'#edf2d8');g.addColorStop(.62,'#e7efd1');g.addColorStop(1,'#dce8c2');ctx.fillStyle=g;ctx.fillRect(0,0,1000,430);
        ctx.globalAlpha=.16;ctx.fillStyle='#c4daa5';[[130,150,160,86],[860,112,190,110],[165,350,190,72],[815,350,175,86],[496,72,150,45]].forEach(([x,y,rx,ry],i)=>{ctx.beginPath();ctx.ellipse(x+Math.sin(t*.18+i)*5,y,rx,ry,-.12,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
        ctx.strokeStyle='#c2d69e';ctx.lineWidth=2;for(const p of grass){ctx.globalAlpha=.32+p.shade*.06;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-3,p.y-p.h);ctx.moveTo(p.x+2,p.y);ctx.lineTo(p.x+2+p.lean,p.y-p.h*.75);ctx.stroke()}ctx.globalAlpha=1;
        for(const p of stars){ctx.globalAlpha=p.a*(.75+.25*Math.sin(t*1.1+p.phase));ctx.fillStyle=p.phase>3?'#ffffff':'#bad29a';ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;
        // soft footpath and a few low-contrast pebble marks keep the effect readable against the field
        ctx.fillStyle='#d5d9c2';ctx.globalAlpha=.34;ctx.beginPath();ctx.moveTo(0,303);ctx.bezierCurveTo(245,270,330,337,570,306);ctx.bezierCurveTo(758,276,835,305,1000,272);ctx.lineTo(1000,331);ctx.bezierCurveTo(770,363,694,336,551,360);ctx.bezierCurveTo(305,396,199,322,0,358);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
      }
      function drawPillar(x,y,width,height,alpha,color){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=alpha;const g=ctx.createLinearGradient(0,y-height*.52,0,y+height*.48);g.addColorStop(0,color+'00');g.addColorStop(.22,color+'35');g.addColorStop(.49,'#fff9deaa');g.addColorStop(.72,color+'55');g.addColorStop(1,color+'00');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-width*.22,y+height*.38);ctx.lineTo(x-width*.15,y-height*.37);ctx.lineTo(x-width*.035,y-height*.51);ctx.lineTo(x+width*.10,y-height*.35);ctx.lineTo(x+width*.27,y+height*.39);ctx.lineTo(x+width*.08,y+height*.33);ctx.lineTo(x-width*.10,y+height*.34);ctx.closePath();ctx.fill();ctx.restore()}
      function drawRays(x,y,t,power,peak){if(peak<=.01)return;ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<22;i++){const a=i*Math.PI*2/22+t*.12+(i%2)*.035,inner=38+(i%4)*7,outer=118+(i%5)*20+peak*82,width=2.4+(i%3)*1.3;const color=i%5===0?'#fffbea':i%2?family.accent:'#f4c75d';ctx.globalAlpha=(.19+(i%4)*.045)*peak*power;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(Math.round(x+Math.cos(a)*inner),Math.round(y+Math.sin(a)*inner*.72));ctx.lineTo(Math.round(x+Math.cos(a+.018)*outer),Math.round(y+Math.sin(a+.018)*outer*.72));ctx.lineTo(Math.round(x+Math.cos(a+width/outer)*outer),Math.round(y+Math.sin(a+width/outer)*outer*.72));ctx.lineTo(Math.round(x+Math.cos(a+width/inner)*inner),Math.round(y+Math.sin(a+width/inner)*inner*.72));ctx.closePath();ctx.fill()}ctx.restore()}
      function drawPixelStar(x,y,size,alpha,color,rotation=0){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(rotation);ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillRect(-size/2,-size/2,size,size);ctx.fillRect(-1,-size*1.6,2,size*3.2);ctx.fillRect(-size*1.6,-1,size*3.2,2);ctx.restore()}
      function cubicPoint(a,b,c,d,t){const s=1-t;return{x:s*s*s*a.x+3*s*s*t*b.x+3*s*t*t*c.x+t*t*t*d.x,y:s*s*s*a.y+3*s*s*t*b.y+3*s*t*t*c.y+t*t*t*d.y}}
      function drawRibbon(segments,progress,alpha,color,phase){if(progress<=.01||alpha<=.01)return;const steps=38,count=Math.max(1,Math.ceil(steps*progress));ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
        const points=[];for(let i=0;i<=count;i++){const u=Math.min(.99999,i/steps),scaled=u*segments.length,segment=Math.min(segments.length-1,Math.floor(scaled)),p=segments[segment],v=Math.min(1,scaled-segment);points.push(cubicPoint(p[0],p[1],p[2],p[3],v))}
        if(points.length>1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.strokeStyle=color;ctx.globalAlpha=alpha*.12;ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='#fff4cb';ctx.globalAlpha=alpha*.4;ctx.lineWidth=1.7;ctx.stroke();
          for(let i=2;i<points.length;i+=3){const p=points[i],pulse=.62+.38*Math.sin(phase*7+i);ctx.globalAlpha=alpha*pulse*(i%2?.65:1);ctx.fillStyle=i%5===0?'#fffdf0':color;const z=i%6===0?4:2.5;ctx.fillRect(Math.round(p.x-z/2),Math.round(p.y-z/2),z,z)}
          const tip=points[points.length-1];drawPixelStar(tip.x,tip.y,4,alpha*.95,'#fffbe1',phase*.18);
        }ctx.restore()}
      function drawCreature(entry,x,y,size,alpha=1,white=false,scaleX=1,scaleY=1){if(!entry?.ready)return;const im=white?entry.silhouette:entry.canvas;ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;ctx.translate(x,y);ctx.scale(scaleX,scaleY);if(white){ctx.globalAlpha=alpha*.72;ctx.shadowColor='#514660';ctx.shadowBlur=0;ctx.shadowOffsetX=1;ctx.shadowOffsetY=2;ctx.drawImage(im,-size/2,-size/2,size,size);ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.globalAlpha=alpha}ctx.drawImage(im,-size/2,-size/2,size,size);ctx.restore()}
      function drawTurnedCreature(entry,x,y,size,alpha,white,scaleX,scaleY,progress,turning){if(!turning)return drawCreature(entry,x,y,size,alpha,white,scaleX,scaleY);const angle=progress*Math.PI*2,planeWidth=.82+.18*Math.abs(Math.cos(angle)),a=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2),seam=.18;let mirrored=0;if(a>=Math.PI/2-seam&&a<=Math.PI/2+seam)mirrored=ease((a-(Math.PI/2-seam))/(seam*2));else if(a>Math.PI/2+seam&&a<Math.PI*1.5-seam)mirrored=1;else if(a>=Math.PI*1.5-seam&&a<=Math.PI*1.5+seam)mirrored=1-ease((a-(Math.PI*1.5-seam))/(seam*2));if(mirrored<.999)drawCreature(entry,x,y,size,alpha*(1-mirrored),white,scaleX*planeWidth,scaleY);if(mirrored>.001)drawCreature(entry,x,y,size,alpha*mirrored,white,-scaleX*planeWidth,scaleY)}
      function phase(t){if(t<.20)return 0;if(t<.48)return 1;if(t<.71)return 2;if(t<.92)return 3;return 4}
      function phaseLabel(q){return ['光效聚集','升空翻转','白色剪影蜕变','进化形态落地','稳定落定'][q]}
      function draw(now){
        const dpr=Math.min(2,window.devicePixelRatio||1),w=canvas.clientWidth||1000,h=w*.43;
        if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
        ctx.setTransform(canvas.width/1000,0,0,canvas.height/430,0,0);ctx.clearRect(0,0,1000,430);
        const t=(now-restartAt)/1000,loop=mode==='manual'?2.85:1.78,phaseT=(t%loop)/loop,visual=phaseT>.13?(phaseT-.13)/.84:0,p=clamp(visual),q=phase(visual);updateAudio(t,visual,loop);background(t);
        phaseName.textContent=phaseLabel(q);
        const from=sprite(family.from),to=sprite(family.to),cx=500,cy=211;
        const lift=86*Math.sin(Math.PI*clamp((visual-.19)/.70));
        const flipProgress=clamp((visual-.28)/.34);
        const flipping=visual>.28&&visual<.62;
        const flipAngle=flipProgress*Math.PI*2;
        const bodyX=cx+(flipping?Math.sin(flipAngle)*22:0),bodyY=cy-lift;
        const strength=mode==='manual'?1:.68;
        const climax=Math.pow(clamp(1-Math.abs(visual-.64)/.19),2),focus=ease(clamp(visual/.2))*(1-ease(clamp((visual-.9)/.1)));
        if(focus>.01){const vignette=ctx.createRadialGradient(cx,cy,74,cx,cy,490);vignette.addColorStop(0,'rgba(51,40,61,0)');vignette.addColorStop(.55,`rgba(51,40,61,${.045*focus})`);vignette.addColorStop(1,`rgba(51,40,61,${.23*focus})`);ctx.fillStyle=vignette;ctx.fillRect(0,0,1000,430)}

        ctx.fillStyle='#6e8056';ctx.globalAlpha=.16*(1-lift/120);ctx.beginPath();ctx.ellipse(cx,cy+41,55-lift*.22,12-lift*.035,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        const gather=ease(clamp(visual/.24)),whitening=ease(clamp((visual-.08)/.22)),morph=ease(clamp((visual-.38)/.22)),colorReveal=ease(clamp((visual-.89)/.08)),settle=ease(clamp((visual-.86)/.12));
        const light=focus*(.2+gather*.16+climax*.58*strength);
        const beamLight=light*(1-.54*morph*(1-colorReveal));
        drawPillar(cx,cy,150,380,.56*beamLight,family.color);
        drawPillar(cx-5,cy-3,56,292,.62*beamLight,'#f4d875');
        drawRays(bodyX,bodyY,t,strength,climax);
        if(climax>.04){const flash=climax*strength*(1-.70*morph*(1-colorReveal));ctx.save();ctx.globalCompositeOperation='lighter';const beam=ctx.createLinearGradient(0,cy-188,0,cy+188);beam.addColorStop(0,'#fff8d900');beam.addColorStop(.28,`rgba(255,246,204,${.11*flash})`);beam.addColorStop(.5,`rgba(255,255,238,${.31*flash})`);beam.addColorStop(.72,`rgba(255,225,155,${.14*flash})`);beam.addColorStop(1,'#fff8d900');ctx.fillStyle=beam;ctx.fillRect(cx-9,cy-188,18,376);ctx.restore()}
        // Converging motes become a brighter, wider orbit before the transformation burst.
        for(let i=0;i<32;i++){
          const a=i*2.399+t*(.78+i%2*.42),radius=(57+((i*37)%106))*(1-gather*.68)+climax*((i%4)*8),px=bodyX+Math.cos(a)*radius,py=bodyY+Math.sin(a)*radius*.72;
          const tw=.58+.42*Math.sin(t*8+i);ctx.globalAlpha=(.24+gather*.58+climax*.17)*tw*strength;ctx.fillStyle=i%6===0?'#fffbea':i%3===0?family.accent:'#f2c45f';const z=i%5===0?5:3;ctx.fillRect(Math.round(px),Math.round(py),z,z);
        }ctx.globalAlpha=1;
        // Two diagonal comets cross behind the creature and leave the frame; neither circles nor encloses it.
        const flow=ease(clamp((visual-.04)/.48))*(1-ease(clamp((visual-.82)/.16)))*strength;
        const left=[[{x:cx-242,y:cy+138},{x:cx-172,y:cy+83-lift*.24},{x:cx-56,y:bodyY+16},{x:cx+12,y:bodyY-67}],[{x:cx+12,y:bodyY-67},{x:cx+58,y:bodyY-126},{x:cx+108,y:bodyY-153},{x:cx+143,y:bodyY-213}]];
        const right=[[{x:cx+240,y:cy+130},{x:cx+157,y:cy+74-lift*.24},{x:cx+53,y:bodyY+9},{x:cx-12,y:bodyY-68}],[{x:cx-12,y:bodyY-68},{x:cx-54,y:bodyY-123},{x:cx-104,y:bodyY-158},{x:cx-143,y:bodyY-211}]];
        drawRibbon(left,flow,.98,family.accent,t);drawRibbon(right,flow*.96,.92,'#f2c45f',t+1.3);
        // Transform beat: keep the creature's baseline fixed; veil briefly silhouettes the current art.
        const pulse=visual<.25?1-.05*Math.sin(gather*Math.PI):visual<.72?1+Math.sin(morph*Math.PI)*.08:1+.12*(1-settle)-.02*Math.sin(t*8)*(1-settle);
        const impact=Math.sin(Math.PI*clamp((visual-.86)/.12));
        const sx=(visual<.72?1-.12*Math.sin(morph*Math.PI):1+.08*(1-settle))*(1+.08*impact),sy=(visual<.72?pulse:1+.13*(1-settle))*(1-.08*impact);
        const oldColorAlpha=1-whitening,oldWhiteAlpha=whitening*(1-morph),newWhiteAlpha=morph*(1-colorReveal);
        if(oldColorAlpha>.005)drawTurnedCreature(from,bodyX,bodyY,100*sizePulse(p),oldColorAlpha,false,sx,sy,flipProgress,flipping);
        if(oldWhiteAlpha>.005)drawTurnedCreature(from,bodyX,bodyY,100*sizePulse(p),oldWhiteAlpha,true,sx,sy,flipProgress,flipping);
        if(newWhiteAlpha>.005)drawTurnedCreature(to,bodyX,bodyY,106*sizePulse(p),newWhiteAlpha,true,sx,sy,flipProgress,flipping);
        if(colorReveal>.005)drawTurnedCreature(to,bodyX,bodyY,106*sizePulse(p),colorReveal,false,1+.05*(1-settle),1+.05*(1-settle),flipProgress,flipping);
        // Pixel shards travel outward during the swap, then become a sparse celebratory sparkle.
        if(visual>.45&&visual<.91){const burst=ease(clamp((visual-.45)/.24));for(let i=0;i<36;i++){const seed=rnd(i*177+5),a=-Math.PI/2+(seed()-.5)*2.45,dist=10+burst*(45+seed()*122),drift=(seed()-.5)*34,px=bodyX+Math.cos(a)*dist,py=bodyY+Math.sin(a)*dist+drift+burst*18;ctx.save();ctx.translate(Math.round(px),Math.round(py));ctx.rotate(a*.25);ctx.globalAlpha=(.88-burst*.36)*(1-clamp((visual-.78)/.15))*strength;ctx.fillStyle=i%6===0?'#fffbea':i%3===0?family.color:family.accent;const sz=3+seed()*4;ctx.fillRect(-sz/2,-sz/2,sz,sz);if(i%4===0){ctx.fillStyle='#fff9de';ctx.fillRect(-1,-sz*1.5,2,sz*3);ctx.fillRect(-sz*1.5,-1,sz*3,2)}ctx.restore()}}
        if(visual>.58){const sparkle=ease(clamp((visual-.58)/.12));for(let i=0;i<8;i++){const x=bodyX+Math.sin(t*.8+i*1.7)*(26+i*14),y=bodyY-22-i*13+Math.cos(t*1.1+i)*8;drawPixelStar(x,y,i%3===0?4:2.8,(.4+.58*sparkle)*(1-settle*.55)*strength,i%3?'#fffbe3':'#f0bf54',t*.08+i*.12)}}
        ctx.globalAlpha=1;
        const show=visual>.96&&visual<.995;callout.classList.toggle('show',show);calloutText.textContent=`${family.toName}，进化完成！`;
        requestAnimationFrame(draw);
      }
      function sizePulse(p){return 1+Math.sin(Math.PI*clamp(p/.16))*.035}
      document.querySelectorAll('[data-family]').forEach(b=>b.addEventListener('click',()=>{family=families[b.dataset.family];document.querySelectorAll('[data-family]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));partyImg.src=`../../assets/icons/${family.from}.png`;const face=sprite(family.from);if(face.ready)partyImg.src=face.canvas.toDataURL();partyName.textContent=family.fromName;restartAnimation(true)}));
      document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));restartAnimation(true)}));
      soundToggle.addEventListener('click',()=>{soundMuted=!soundMuted;if(soundMuted){if(audioContext&&sfxBus)sfxBus.gain.setTargetAtTime(.0001,audioContext.currentTime,.025)}else{prepareAudio();restartAnimation(false)}syncSoundUi()});
      document.getElementById('replay').addEventListener('click',()=>restartAnimation(true));
      syncSoundUi();sprite(family.from);sprite(family.to);requestAnimationFrame(draw);
    })();
