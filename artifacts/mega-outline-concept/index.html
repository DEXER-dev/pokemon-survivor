<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEGA 精灵呼吸描边预览</title>
  <style>
    :root { color-scheme: light; font-family: "Fusion Pixel", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #35483e; background: #dfe8cf; }
    .preview { width: min(920px, 100%); overflow: hidden; border: 3px solid #53624c; border-radius: 9px; background: #f6f4df; box-shadow: 0 7px 0 #adb89d; }
    header { min-height: 68px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff8e7; border-bottom: 2px solid #c0c6ad; }
    h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
    .badge { padding: 6px 10px; border: 1px solid #7bb7bb; border-radius: 999px; color: #28636b; background: #effcff; font-size: 12px; white-space: nowrap; }
    .field { height: clamp(310px, 47vw, 390px); position: relative; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse at 20% 82%, #d8e6bd 0 11%, transparent 11.5%), radial-gradient(ellipse at 82% 18%, #dce8c2 0 16%, transparent 16.5%), linear-gradient(145deg,#edf2dd,#e4edcf 58%,#eaf0d9); }
    .grass { position: absolute; width: 12px; height: 8px; opacity: .55; }
    .grass::before,.grass::after { content:""; position:absolute; bottom:0; width:1px; height:8px; background:#a9c585; transform-origin:bottom; }
    .grass::before { left:4px; transform:rotate(-22deg); } .grass::after { left:8px; transform:rotate(19deg); height:6px; }
    .g1 { left:13%; top:25%; } .g2 { left:26%; top:76%; transform:scale(1.3); } .g3 { right:17%; top:27%; transform:scale(.8); } .g4 { right:12%; bottom:15%; transform:scale(1.2); }
    .shadow { position:absolute; left:50%; top:66%; width:152px; height:27px; transform:translate(-50%,-50%); border-radius:50%; background:#77836a; opacity:.32; filter:blur(1px); }
    canvas { position:absolute; left:50%; top:47%; width:192px; height:192px; transform:translate(-50%,-50%); image-rendering:pixelated; }
    .outline-layer { z-index:1; pointer-events:none; }
    .sprite-layer { z-index:2; }
    .outline-layer.breathing { animation:outline-breathe 1.5s ease-in-out infinite; }
    @keyframes outline-breathe {
      0%,100% { opacity:.36; filter:brightness(.88) drop-shadow(0 0 1px var(--glow-soft)) drop-shadow(0 0 2px var(--glow-faint)); }
      50% { opacity:1; filter:brightness(1.35) drop-shadow(0 0 3px var(--glow-strong)) drop-shadow(0 0 8px var(--glow-wide)); }
    }
    .spark-layer { position:absolute; z-index:3; left:50%; top:47%; width:192px; height:192px; transform:translate(-50%,-50%); pointer-events:none; }
    .spark { position:absolute; width:3px; height:3px; opacity:0; background:var(--outline-color); box-shadow:0 0 4px 1px var(--glow-strong); image-rendering:pixelated; }
    .spark-layer.active .spark { animation:spark-drift var(--duration,1.2s) ease-out var(--delay,0s) infinite; }
    .spark:nth-child(3n + 2) { width:4px; height:4px; background:var(--highlight-color); box-shadow:0 0 5px 2px var(--glow-strong); }
    .spark:nth-child(3n) { background:var(--deep-color); box-shadow:0 0 4px 1px var(--glow-wide); }
    @keyframes spark-drift {
      0% { opacity:0; transform:translate(0,0) rotate(0deg) scale(.45); }
      14% { opacity:1; transform:translate(0,0) rotate(45deg) scale(1); }
      62% { opacity:.82; }
      100% { opacity:0; transform:translate(var(--dx),var(--dy)) rotate(90deg) scale(.45); }
    }
    .stone { position:absolute; z-index:4; left:calc(50% + 92px); top:calc(47% - 78px); width:58px; height:58px; image-rendering:pixelated; filter:drop-shadow(1px 2px 0 #596650); animation:float 2.2s ease-in-out infinite; }
    @keyframes float { 50% { transform:translateY(-5px) rotate(7deg); } }
    .caption { position:absolute; z-index:5; left:50%; top:calc(47% + 111px); transform:translateX(-50%); padding:5px 10px; border:1px solid var(--outline-color); border-radius:999px; color:var(--deep-color); background:#fff9e9e8; font-size:12px; white-space:nowrap; }
    .controls { padding:16px 18px 11px; display:flex; flex-wrap:wrap; gap:9px; justify-content:center; border-top:2px solid #c8d0b8; background:#f8f5e5; }
    .roster { padding:14px 16px 16px; border-top:2px solid #c8d0b8; background:#eef1dd; }
    .roster-heading { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 2px 10px; color:#445744; }
    .roster-heading strong { font-size:14px; } .roster-heading span { color:#71806c; font-size:11px; }
    .form-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
    .form-card { min-width:0; min-height:62px; padding:5px 8px; display:flex; align-items:center; gap:7px; text-align:left; font-size:11px; line-height:1.3; }
    .form-card[aria-pressed="true"] { color:var(--form-color,#245b64); border-color:var(--form-color,#3e9aa6); background:#fffdf2; }
    .form-thumb { position:static; left:auto; top:auto; z-index:auto; width:46px; height:46px; flex:0 0 46px; transform:none; image-rendering:pixelated; }
    .form-label-row { min-width:0; display:flex; align-items:center; gap:5px; }
    .form-name { display:block; overflow-wrap:anywhere; }
    .form-swatch { width:9px; height:9px; flex:0 0 9px; border:1px solid #4e5945; border-radius:50%; background:var(--form-color); box-shadow:0 0 4px var(--form-color); }
    .tone-chip { display:inline-flex; align-items:center; gap:5px; margin:4px 0 0 7px; padding:2px 7px; border:1px solid #c5cbb9; border-radius:999px; color:#475846; background:#fffbea; white-space:nowrap; }
    .tone-chip i { width:9px; height:9px; border:1px solid #4e5945; border-radius:50%; background:var(--form-color); box-shadow:0 0 4px var(--form-color); }
    button { padding:9px 13px; border:2px solid #a9b49c; border-radius:7px; color:#4d5a49; background:#fffbea; font:inherit; font-size:13px; cursor:pointer; box-shadow:0 2px 0 #c5cbb9; }
    button:hover { border-color:#77b8bd; } button[aria-pressed="true"] { color:#245b64; border-color:#3e9aa6; background:#e7fbfa; box-shadow:0 2px 0 #91c5c5; }
    .detail { min-height:64px; margin:0; padding:2px 20px 15px; color:#5d6c58; text-align:center; font-size:13px; line-height:1.65; background:#f8f5e5; }
    .detail strong { color:#28636b; }
    @media (max-width:620px) { body { padding:10px; } header { padding:10px 12px; } h1 { font-size:15px; } .badge { font-size:10px; padding:5px 7px; } canvas { width:168px; height:168px; } .spark-layer { width:168px; height:168px; } .stone { left:calc(50% + 77px); width:48px; height:48px; } button { font-size:12px; padding:8px 10px; } .roster { padding:12px 9px; } .roster-heading { align-items:flex-start; flex-direction:column; gap:3px; } .form-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; } .form-card { min-height:64px; padding:4px; gap:3px; flex-direction:column; justify-content:center; text-align:center; font-size:10px; } .form-thumb { width:40px; height:40px; flex-basis:40px; } }
  </style>
</head>
<body>
  <main class="preview" aria-label="MEGA 精灵形态和像素描边预览">
    <header><h1>MEGA 形态图鉴 · 19 种</h1><span class="badge">项目内现有形态</span></header>
    <section class="field" aria-label="MEGA 形态专属描边效果预览">
      <i class="grass g1"></i><i class="grass g2"></i><i class="grass g3"></i><i class="grass g4"></i>
      <div class="shadow"></div>
      <canvas id="outline" class="outline-layer" width="64" height="64" aria-hidden="true"></canvas>
      <canvas id="sprite" class="sprite-layer" width="64" height="64" role="img" aria-label="超级喷火龙 X"></canvas>
      <div id="sparks" class="spark-layer" aria-hidden="true">
        <i class="spark" style="left:4%;top:30%;--dx:-18px;--dy:-5px;--delay:-.25s;--duration:1.15s"></i>
        <i class="spark" style="left:18%;top:8%;--dx:-12px;--dy:-18px;--delay:-.72s;--duration:1.3s"></i>
        <i class="spark" style="left:40%;top:2%;--dx:-5px;--dy:-20px;--delay:-.38s;--duration:1.18s"></i>
        <i class="spark" style="left:75%;top:8%;--dx:12px;--dy:-18px;--delay:-.92s;--duration:1.28s"></i>
        <i class="spark" style="left:96%;top:30%;--dx:19px;--dy:-10px;--delay:-.18s;--duration:1.22s"></i>
        <i class="spark" style="left:98%;top:52%;--dx:20px;--dy:4px;--delay:-.62s;--duration:1.3s"></i>
        <i class="spark" style="left:82%;top:76%;--dx:16px;--dy:13px;--delay:-.4s;--duration:1.16s"></i>
        <i class="spark" style="left:64%;top:94%;--dx:7px;--dy:18px;--delay:-.86s;--duration:1.3s"></i>
        <i class="spark" style="left:43%;top:91%;--dx:-6px;--dy:19px;--delay:-.12s;--duration:1.22s"></i>
        <i class="spark" style="left:13%;top:77%;--dx:-17px;--dy:12px;--delay:-.56s;--duration:1.26s"></i>
      </div>
      <img id="stone" class="stone" src="../../assets/items/mega/CHARIZARDITEX.png" alt="喷火龙进化石 X">
      <div id="caption" class="caption">超级喷火龙 X</div>
    </section>
    <section class="roster" aria-label="项目内 MEGA 形态图鉴">
      <div class="roster-heading"><strong>选择 MEGA 形态</strong><span>点选查看实际精灵图与描边效果</span></div>
      <div id="form-grid" class="form-grid"></div>
    </section>
    <nav class="controls" aria-label="选择描边效果">
      <button type="button" data-style="none" aria-pressed="false">原样</button>
      <button type="button" data-style="cyan" aria-pressed="true">形态专属呼吸描边 · 推荐</button>
      <button type="button" data-style="double" aria-pressed="false">形态专属双层描边</button>
    </nav>
    <p class="detail" id="detail"><strong>推荐方案：</strong>每种 MEGA 都有专属描边色，呼吸光与粒子会随形态一起换色；光效贴着精灵外轮廓，不遮住本体细节。</p>
  </main>
  <script>
    const image = new Image();
    const canvas = document.querySelector("#sprite");
    const ctx = canvas.getContext("2d", { alpha: true });
    const outlineCanvas = document.querySelector("#outline");
    const outlineCtx = outlineCanvas.getContext("2d", { alpha: true });
    const sparkLayer = document.querySelector("#sparks");
    const stone = document.querySelector("#stone");
    const caption = document.querySelector("#caption");
    const formGrid = document.querySelector("#form-grid");
    const source = document.createElement("canvas");
    source.width = source.height = 64;
    const sourceCtx = source.getContext("2d", { willReadFrequently: true });
    const detail = document.querySelector("#detail");
    const megaForms = [
      { name:"超级妙蛙花", icon:"VENUSAUR_1", stone:"VENUSAURITE", color:[92,196,83], highlight:[204,255,143], deep:[42,112,56] },
      { name:"超级喷火龙 X", icon:"CHARIZARD_1", stone:"CHARIZARDITEX", color:[58,207,242], highlight:[199,255,255], deep:[30,104,176] },
      { name:"超级喷火龙 Y", icon:"CHARIZARD_2", stone:"CHARIZARDITEY", color:[255,133,45], highlight:[255,237,123], deep:[179,69,36] },
      { name:"超级水箭龟", icon:"BLASTOISE_1", stone:"BLASTOISINITE", color:[66,152,255], highlight:[190,233,255], deep:[37,75,164] },
      { name:"超级巨沼怪", icon:"SWAMPERT_1", stone:"SWAMPERTITE", color:[35,190,206], highlight:[179,255,236], deep:[22,101,132] },
      { name:"超级耿鬼", icon:"GENGAR_1", stone:"GENGARITE", color:[181,93,242], highlight:[245,193,255], deep:[91,47,163] },
      { name:"超级沙奈朵", icon:"GARDEVOIR_1", stone:"GARDEVOIRITE", color:[245,111,173], highlight:[255,219,238], deep:[156,56,117] },
      { name:"超级大针蜂", icon:"BEEDRILL_1", stone:"BEEDRILLITE", color:[232,183,47], highlight:[255,246,157], deep:[143,101,30] },
      { name:"超级电龙", icon:"AMPHAROS_1", stone:"AMPHAROSITE", color:[255,213,45], highlight:[255,250,178], deep:[183,121,24] },
      { name:"超级大比鸟", icon:"PIDGEOT_1", stone:"PIDGEOTITE", color:[210,143,55], highlight:[255,223,142], deep:[130,76,43] },
      { name:"超级火焰鸡", icon:"BLAZIKEN_1", stone:"BLAZIKENITE", color:[246,91,58], highlight:[255,203,122], deep:[165,43,49] },
      { name:"超级胡地", icon:"ALAKAZAM_1", stone:"ALAKAZITE", color:[166,123,255], highlight:[230,208,255], deep:[87,63,172] },
      { name:"超级路卡利欧", icon:"LUCARIO_1", stone:"LUCARIONITE", color:[45,124,255], highlight:[183,222,255], deep:[33,59,151] },
      { name:"超级波士可多拉", icon:"AGGRON_1", stone:"AGGRONITE", color:[133,174,195], highlight:[229,248,255], deep:[66,91,112] },
      { name:"超级蜥蜴王", icon:"SCEPTILE_1", stone:"SCEPTILITE", color:[73,212,119], highlight:[192,255,154], deep:[34,117,78] },
      { name:"超级暴飞龙", icon:"SALAMENCE_1", stone:"SALAMENCITE", color:[244,75,85], highlight:[255,184,164], deep:[143,40,72] },
      { name:"超级烈咬陆鲨", icon:"GARCHOMP_1", stone:"GARCHOMPITE", color:[194,82,176], highlight:[255,188,233], deep:[99,42,121] },
      { name:"超级巨金怪", icon:"METAGROSS_1", stone:"METAGROSSITE", color:[108,164,255], highlight:[215,243,255], deep:[48,83,151] },
      { name:"超级班基拉斯", icon:"TYRANITAR_1", stone:"TYRANITARITE", color:[173,198,67], highlight:[238,255,142], deep:[91,112,44] }
    ];
    let currentStyle = "cyan";
    let currentForm = megaForms[1];
    const field = document.querySelector(".field");
    const formButtons = [];
    const copy = {
      none: "当前素材自带深色像素边；不额外描边，保留原始样子。",
      cyan: "<strong>形态专属呼吸描边：</strong>描边、呼吸光与粒子统一使用当前 MEGA 的主题色。",
      double: "<strong>形态专属双层描边：</strong>用当前 MEGA 的深色压外轮廓、亮色提内缘，粒子也同步换色。"
    };
    const rgb = value => `rgb(${value.join(",")})`;
    const rgba = (value, alpha) => `rgba(${value.join(",")},${alpha})`;
    function applyFormPalette(form) {
      field.style.setProperty("--outline-color", rgb(form.color));
      field.style.setProperty("--highlight-color", rgb(form.highlight));
      field.style.setProperty("--deep-color", rgb(form.deep));
      field.style.setProperty("--glow-soft", rgba(form.color, .25));
      field.style.setProperty("--glow-faint", rgba(form.color, .18));
      field.style.setProperty("--glow-strong", rgba(form.highlight, .92));
      field.style.setProperty("--glow-wide", rgba(form.color, .72));
    }
    function render(style = currentStyle) {
      currentStyle = style;
      sourceCtx.clearRect(0, 0, 64, 64);
      sourceCtx.drawImage(image, 0, 0, 64, 64, 0, 0, 64, 64);
      const sprite = sourceCtx.getImageData(0, 0, 64, 64);
      const pixels = sprite.data;
      const outline = outlineCtx.createImageData(64, 64);
      const out = outline.data;
      const outside = new Uint8Array(64 * 64);
      const queue = [];
      for (let i = 0; i < 64; i++) {
        for (const index of [i, 63 * 64 + i, i * 64, i * 64 + 63]) {
          if (pixels[index * 4 + 3] <= 12 && !outside[index]) { outside[index] = 1; queue.push(index); }
        }
      }
      for (let head = 0; head < queue.length; head++) {
        const index = queue[head], x = index % 64, y = Math.floor(index / 64);
        for (const next of [x > 0 ? index - 1 : -1, x < 63 ? index + 1 : -1, y > 0 ? index - 64 : -1, y < 63 ? index + 64 : -1]) {
          if (next >= 0 && !outside[next] && pixels[next * 4 + 3] <= 12) { outside[next] = 1; queue.push(next); }
        }
      }
      if (style !== "none") {
        for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
          const p = (y * 64 + x) * 4;
          if (pixels[p + 3] > 12 || !outside[y * 64 + x]) continue;
          let nearest = 3;
          for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
            const d = Math.max(Math.abs(ox), Math.abs(oy));
            if (!d || d > 2) continue;
            const nx = x + ox, ny = y + oy;
            if (nx < 0 || nx >= 64 || ny < 0 || ny >= 64) continue;
            if (pixels[(ny * 64 + nx) * 4 + 3] > 12) nearest = Math.min(nearest, d);
          }
          if (nearest > 2) continue;
          let color;
          const tone = style === "double" ? (nearest === 1 ? currentForm.highlight : currentForm.deep) : currentForm.color;
          color = [tone[0], tone[1], tone[2], 255];
          out[p] = color[0]; out[p + 1] = color[1]; out[p + 2] = color[2]; out[p + 3] = color[3];
        }
      }
      outlineCtx.clearRect(0, 0, 64, 64);
      outlineCtx.putImageData(outline, 0, 0);
      outlineCanvas.classList.toggle("breathing", style !== "none");
      ctx.clearRect(0, 0, 64, 64);
      ctx.drawImage(source, 0, 0);
      sparkLayer.classList.toggle("active", style !== "none");
      const colorHex = `#${currentForm.color.map(channel => channel.toString(16).padStart(2, "0")).join("").toUpperCase()}`;
      detail.innerHTML = `${copy[style]} <span class="tone-chip" style="--form-color:${rgb(currentForm.color)}"><i aria-hidden="true"></i>${currentForm.name} · ${colorHex}</span>`;
      document.querySelectorAll("button[data-style]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.style === style)));
    }
    function selectForm(form, button) {
      currentForm = form;
      applyFormPalette(form);
      caption.textContent = form.name;
      canvas.setAttribute("aria-label", form.name);
      stone.src = `../../assets/items/mega/${form.stone}.png`;
      stone.alt = `${form.name}进化石`;
      image.src = `../../assets/icons/${form.icon}.png`;
      formButtons.forEach(card => {
        card.setAttribute("aria-pressed", String(card === button));
      });
    }
    image.onload = () => render(currentStyle);
    for (const form of megaForms) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "form-card";
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-label", `${form.name}，专属描边色 ${form.color.map(channel => channel.toString(16).padStart(2, "0")).join("").toUpperCase()}`);
      button.style.setProperty("--form-color", rgb(form.color));
      const thumbnail = document.createElement("canvas");
      thumbnail.width = thumbnail.height = 64;
      thumbnail.className = "form-thumb";
      thumbnail.setAttribute("aria-hidden", "true");
      const labelRow = document.createElement("span");
      labelRow.className = "form-label-row";
      const label = document.createElement("span");
      label.className = "form-name";
      label.textContent = form.name;
      const swatch = document.createElement("i");
      swatch.className = "form-swatch";
      swatch.title = `${form.name}专属描边色`;
      swatch.setAttribute("aria-hidden", "true");
      labelRow.append(label, swatch);
      button.append(thumbnail, labelRow);
      formGrid.append(button);
      formButtons.push(button);
      const thumbImage = new Image();
      thumbImage.onload = () => thumbnail.getContext("2d").drawImage(thumbImage, 0, 0, 64, 64, 0, 0, 64, 64);
      thumbImage.src = `../../assets/icons/${form.icon}.png`;
      button.addEventListener("click", () => selectForm(form, button));
    }
    document.querySelectorAll("button[data-style]").forEach(button => button.addEventListener("click", () => render(button.dataset.style)));
    selectForm(megaForms[1], formButtons[1]);
  </script>
</body>
</html>
