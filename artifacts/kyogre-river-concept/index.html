<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243c">
  <title>海之洞窟 · 盖欧卡河道预览</title>
  <style>
    @font-face{font-family:FusionPixel;src:url('../../assets/fonts/fusion-pixel/fusion-pixel-12px-proportional-zh_hans.otf.woff2') format('woff2');font-display:swap}
    :root{color-scheme:dark;--ink:#e7f6ff;--muted:#9bb8cb;--line:#547890;--deep:#10243c;--aqua:#56d8f2;--sand:#f1d995}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:FusionPixel,"Microsoft YaHei",sans-serif;color:var(--ink)}
    body{min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% 0,#335b79,#182f49 60%,#101b2c);display:grid;place-items:center}
    button,input{font:inherit}.page{width:min(1260px,100%)}
    .heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 12px}.title{display:flex;gap:11px;align-items:center}.sigil{display:grid;place-items:center;width:42px;height:42px;border:2px solid #89dbec;border-radius:50%;background:#193a56;box-shadow:inset 0 0 0 4px #10243c;color:#abf2ff;font-size:23px}.eyebrow{font:700 9px/1.3 system-ui,sans-serif;letter-spacing:.16em;color:#91d4e4}.heading h1{margin:3px 0 0;font-size:20px;color:#f4edcc}.heading p{margin:4px 0 0;color:#aec6d4;font:11px/1.45 system-ui,sans-serif}.badge{padding:7px 10px;border:1px solid #6c95aa;border-radius:999px;background:#142b43;color:#c5eff4;font:10px system-ui,sans-serif;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:stretch}
    .stage{position:relative;overflow:hidden;aspect-ratio:3/2;min-width:0;border:3px solid #102239;border-radius:15px;background:#28466a url('./river-background.png') center/100% 100% no-repeat;box-shadow:0 7px 0 #08152488,0 20px 48px #09152466,inset 0 0 0 1px #a9e9f255;isolation:isolate}
    .stage:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#b5e9ff0a,#0a24400c 72%,#0b203922)}
    .flow-glints{position:absolute;z-index:2;left:0;right:0;top:32%;height:47%;pointer-events:none;opacity:.31;background:repeating-linear-gradient(90deg,transparent 0 8%,#d3fbff22 8.2% 8.5%,transparent 8.8% 17%);background-size:250px 100%;mask-image:linear-gradient(180deg,transparent,#000 17%,#000 80%,transparent);animation:flow 11s linear infinite}
    .ambient{position:absolute;z-index:3;inset:0;pointer-events:none}.bubble{position:absolute;width:6px;height:6px;border:1px solid #b9f5ff;border-radius:50%;background:#74d9f566;box-shadow:0 0 8px #71e6ff88;animation:bubble-rise var(--dur) linear var(--delay) infinite}.b1{left:15%;top:59%;--dur:6s;--delay:-3s}.b2{left:28%;top:67%;--dur:7.2s;--delay:-1s;width:4px;height:4px}.b3{left:46%;top:54%;--dur:5.8s;--delay:-4s}.b4{left:68%;top:62%;--dur:7s;--delay:-2s;width:5px;height:5px}.b5{left:84%;top:49%;--dur:6.4s;--delay:-5s;width:4px;height:4px}
    .swimmer{position:absolute;z-index:5;left:6%;top:44%;width:clamp(114px,15vw,184px);height:clamp(114px,15vw,184px);transform:translate(-50%,-50%);animation:river-patrol 19s linear infinite;filter:drop-shadow(0 8px 4px #0c254b78)}
    .kyogre-form{position:absolute;inset:0;background:url('../../assets/icons/KYOGRE.png') left top/200% 100% no-repeat;image-rendering:pixelated;animation:swim-bob 1.35s ease-in-out infinite alternate;transform-origin:center}
    .kyogre-form.right{animation:swim-bob 1.35s ease-in-out infinite alternate,face-right 19s steps(1,end) infinite}
    .kyogre-form.left{transform:scaleX(-1);animation:swim-bob 1.35s ease-in-out infinite alternate,face-left 19s steps(1,end) infinite}
    .wake{position:absolute;z-index:-1;left:-11%;top:48%;width:56%;height:30%;border:2px solid #b9f9ff88;border-left-color:transparent;border-right-color:transparent;border-radius:50%;transform:rotate(-12deg);filter:drop-shadow(0 0 7px #67dbfa);animation:wake 1.1s ease-out infinite}
    .wake.w2{left:-20%;top:60%;width:44%;height:23%;animation-delay:.38s;opacity:.72}.wake.w3{left:14%;top:78%;width:14%;height:12%;border-color:#e7ffff;border-left-color:transparent;animation:splash .8s ease-out infinite}
    .ripple{position:absolute;z-index:-2;left:50%;top:74%;width:82%;height:18%;transform:translate(-50%,-50%);border:2px solid #b5f8ff6e;border-radius:50%;box-shadow:0 0 12px #5fdafa66,inset 0 0 8px #69dbf744;animation:ripple 2.2s ease-out infinite}
    .ripple.r2{animation-delay:1.1s}
    .swim-tag{position:absolute;z-index:6;left:50%;top:-7px;transform:translateX(-50%);padding:5px 8px;border:1px solid #a8eaff;border-radius:999px;background:#102b43df;color:#e4fbff;font-size:10px;white-space:nowrap;box-shadow:0 2px 7px #0b1e3288}
    .corner-hud{position:absolute;z-index:8;left:12px;top:12px;padding:8px 10px;border:1px solid #b9e4df;border-radius:9px;background:#f8f2dcf2;color:#25384a;box-shadow:0 3px 0 #13263d88;min-width:168px}.corner-hud strong{display:block;font-size:11px}.corner-hud small{display:block;margin-top:4px;color:#4f6d7a;font:9px/1.4 system-ui,sans-serif}
    .side{display:flex;flex-direction:column;gap:9px}.card{padding:12px;border:1px solid #547890;border-radius:12px;background:linear-gradient(155deg,#203c56,#172c43);box-shadow:0 4px 0 #08172777}.card h2{margin:0 0 8px;color:#f4edcc;font-size:13px}.card p{margin:0;color:#b4c9d5;font:11px/1.6 system-ui,sans-serif}.stats{display:grid;gap:7px}.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#b5c9d4;font:10px system-ui,sans-serif}.stat b{color:#e3faff;font-weight:600}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.controls button{min-height:34px;border:1px solid #648ba0;border-radius:8px;background:#17334c;color:#e1f5f6;font-size:10px;cursor:pointer}.controls button:hover{background:#234763;border-color:#93d9e5}.controls button.primary{grid-column:span 2;background:linear-gradient(#b5edf0,#68bdcf);border-color:#c9ffff;color:#123148;box-shadow:0 3px #326a82;font-weight:bold}.controls button.primary:active{transform:translateY(2px);box-shadow:0 1px #326a82}
    .footer{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:#9db8c7;font:10px/1.5 system-ui,sans-serif}.footer strong{color:#d9eced}
    .stage.paused *{animation-play-state:paused!important}.stage.paused .swim-tag{opacity:.75}
    @keyframes flow{to{background-position:250px 0}}@keyframes bubble-rise{0%{opacity:0;transform:translateY(15px) scale(.55)}20%{opacity:.75}100%{opacity:0;transform:translateY(-60px) scale(1.08)}}
    @keyframes river-patrol{0%{left:6%;top:43%}10%{left:20%;top:42%}20%{left:34%;top:48%}30%{left:46%;top:56%}40%{left:61%;top:61%}50%{left:94%;top:47%}60%{left:75%;top:51%}70%{left:61%;top:61%}80%{left:46%;top:56%}90%{left:25%;top:45%}100%{left:6%;top:43%}}
    @keyframes face-right{0%,49.8%,100%{opacity:1}50%,99.8%{opacity:0}}@keyframes face-left{0%,49.8%,100%{opacity:0}50%,99.8%{opacity:1}}
    @keyframes swim-bob{from{translate:0 1px;scale:1 .97}to{translate:0 -3px;scale:1 1.03}}@keyframes ripple{0%{opacity:0;scale:.62 0.68}25%{opacity:.7}100%{opacity:0;scale:1.24 1.2}}@keyframes wake{0%{opacity:.1;scale:.7}38%{opacity:.9}100%{opacity:0;scale:1.4 1.3}}@keyframes splash{0%,100%{opacity:0;transform:rotate(-35deg) scale(.65)}40%{opacity:.85}75%{opacity:0;transform:rotate(-35deg) translate(3px,-10px) scale(1.2)}}
    @media(max-width:900px){body{padding:12px}.layout{grid-template-columns:1fr}.stage{aspect-ratio:3/2}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.card:first-child{grid-row:span 2}.footer{flex-direction:column}}
    @media(max-width:560px){body{padding:8px}.heading{align-items:flex-start}.heading h1{font-size:16px}.heading p{font-size:10px}.sigil{width:35px;height:35px}.badge{font-size:8px;padding:5px 7px}.stage{aspect-ratio:1/1.12;border-radius:11px;background-size:auto 100%;background-position:center}.swimmer{width:clamp(100px,26vw,145px);height:clamp(100px,26vw,145px)}.side{grid-template-columns:1fr 1fr}.card{padding:9px}.card h2{font-size:11px}.card p{font-size:10px}.stats{gap:5px}.stat{font-size:9px}.controls button{font-size:9px}.corner-hud{left:7px;top:7px;min-width:0;padding:6px 8px}.corner-hud strong{font-size:9px}.corner-hud small{font-size:8px}.swim-tag{font-size:8px;padding:4px 6px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:24s!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="heading"><div class="title"><span class="sigil" aria-hidden="true">≋</span><div><div class="eyebrow">KYOGRE · MARINE CAVE RIVER</div><h1>盖欧卡 · 河道游弋</h1><p>以《绿宝石》海之洞窟为灵感，把静止水池改成可游动的蜿蜒河道。</p></div></div><span class="badge">场景动画预览 · 静音</span></header>
    <section class="layout" aria-label="盖欧卡河道预览">
      <div class="stage" id="stage">
        <div class="flow-glints" aria-hidden="true"></div>
        <div class="ambient" aria-hidden="true"><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i><i class="bubble b5"></i></div>
        <div class="corner-hud"><strong>海之洞窟 · 地下河道</strong><small>深水区 · 盖欧卡正在巡游</small></div>
        <div class="swimmer" id="swimmer" role="img" aria-label="盖欧卡沿着河道来回游动">
          <i class="ripple"></i><i class="ripple r2"></i><i class="wake"></i><i class="wake w2"></i><i class="wake w3"></i>
          <span class="swim-tag">盖欧卡</span><div class="kyogre-form right"></div><div class="kyogre-form left"></div>
        </div>
      </div>
      <aside class="side">
        <section class="card"><h2>游动路线</h2><p>盖欧卡沿着河道的弯曲水路往返巡游，经过转弯处时自然改变朝向；身后带出短暂涟漪和水花。</p></section>
        <section class="card"><h2>场景方向</h2><div class="stats"><div class="stat"><span>镜头</span><b>正俯视</b></div><div class="stat"><span>水体</span><b>蜿蜒河道</b></div><div class="stat"><span>场景原型</span><b>海之洞窟</b></div></div><div class="controls"><button class="primary" id="toggle" type="button">暂停游动</button><button id="replay" type="button">重播路线</button><button id="speed" type="button">游动速度：标准</button></div></section>
      </aside>
    </section>
    <footer class="footer"><span><strong>演示内容：</strong>盖欧卡沿河游动 · 转向 · 水面尾迹</span><span>预览素材为概念设计，尚未改动游戏实装。</span></footer>
  </main>
  <script>
    (()=>{
      const stage=document.getElementById('stage');
      const swimmer=document.getElementById('swimmer');
      const toggle=document.getElementById('toggle');
      const replay=document.getElementById('replay');
      const speed=document.getElementById('speed');
      let paused=false,fast=false;
      toggle.addEventListener('click',()=>{paused=!paused;stage.classList.toggle('paused',paused);toggle.textContent=paused?'继续游动':'暂停游动'});
      replay.addEventListener('click',()=>{swimmer.style.animation='none';void swimmer.offsetWidth;swimmer.style.animation='';if(paused){paused=false;stage.classList.remove('paused');toggle.textContent='暂停游动'}});
      speed.addEventListener('click',()=>{fast=!fast;swimmer.style.animationDuration=fast?'13s':'19s';speed.textContent=`游动速度：${fast?'快速':'标准'}`});
    })();
  </script>
</body>
</html>
