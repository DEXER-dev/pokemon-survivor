<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>神兽血条 · 像素纹章设计</title>
<style>
@font-face{font-family:Fusion;src:url('../../assets/fonts/fusion-pixel/fusion-pixel-12px-proportional-zh_hans.otf.woff2')}*{box-sizing:border-box}body{margin:0;background:#ece9df;color:#343942;font-family:Fusion,'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:28px 24px 40px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}small{font:10px system-ui;letter-spacing:.16em;color:#847d6e}h1{font-size:26px;margin:7px 0}p{font:13px/1.7 system-ui;margin:6px 0;color:#72777a}.tag{font:11px system-ui;background:#fff9eb;border:1px solid #d1c8b5;border-radius:5px;padding:9px 12px;white-space:nowrap}.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:18px 0;font-size:12px}label{display:flex;gap:10px;align-items:center}button,select{font:inherit;border:1px solid #c4bca8;background:#fffaf0;color:#45494d;padding:8px 13px;border-radius:5px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #698aa4;outline-offset:3px}button.active{background:#3d4756;color:#fff8e6;border-color:#3d4756}input{accent-color:#986738;width:180px}output{min-width:42px;font:12px system-ui;font-variant-numeric:tabular-nums}.stage{position:relative;min-height:320px;height:40vw;max-height:420px;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 65% 55%,#d2dca2 0,transparent 43%),linear-gradient(155deg,#edf1d7,#d9e2bc);border:1px solid #b7c39f;transition:background .3s}.stage.dark{background:radial-gradient(ellipse at 55% 55%,#465573,transparent 70%),linear-gradient(#252f48,#394966);border-color:#303d56}.stage:after{content:'';position:absolute;inset:45% -10% -30%;border-radius:50%;background:#ffffff0c;border-top:2px solid #ffffff16;pointer-events:none}.stage-label{position:absolute;left:18px;bottom:16px;font:11px system-ui;color:#71836d;z-index:1}.stage.dark .stage-label{color:#b5c1d8}.hero-bar{position:relative;width:min(720px,92%);margin:22px auto 0;z-index:2}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.sprite{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:120px;height:120px;image-rendering:pixelated;background-size:240px 120px;background-repeat:no-repeat;filter:drop-shadow(0 7px 0 #202d402b);z-index:1}.floor-shadow{position:absolute;left:50%;top:78%;transform:translateX(-50%);width:110px;height:16px;border-radius:50%;background:#263b4120}.caption{display:flex;justify-content:space-between;gap:16px;margin:12px 2px 22px;font:12px/1.6 system-ui;color:#737777}.caption strong{color:#455461}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sample{padding:10px 10px 9px;background:#f8f5ec;border:1px solid #d6cebb;border-radius:7px;cursor:pointer;transition:border-color .2s,box-shadow .2s}.sample.selected{border-color:#9b8158;box-shadow:0 0 0 2px #ad945733}.sample.dark{background:#303c52;border-color:#4c5a71}.sample .motif{font:10px/1.5 system-ui;color:#7f817b;margin:0 8px}.sample.dark .motif{color:#b3bed0}.foot{margin-top:20px;font:11px/1.7 system-ui;color:#84847d}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 14px}.stage{min-height:290px}.sprite{width:96px;height:96px;background-size:192px 96px}h1{font-size:22px}}@media(max-width:520px){.grid{grid-template-columns:1fr}header{align-items:start}.tag{display:none}.hero-bar{width:96%}.stage{min-height:260px}.controls{gap:12px}input{width:130px}.caption{flex-direction:column;gap:3px}.sprite{top:65%}.floor-shadow{top:86%}}
</style></head>
<body><main>
<header><div><small>LEGENDARY · PIXEL HERALDRY</small><h1>把神兽的形态，画进血条</h1><p>窄槽、像素端饰、清楚的血量。每只神兽都有自己的轮廓。</p></div><span class="tag">已接入正式神兽战 HUD</span></header>
<div class="controls"><label>首领<select id="boss" aria-label="选择神兽"></select></label><label>生命<input id="hp" aria-label="生命值" type="range" min="0" max="100" value="68"><output id="pct">68%</output></label><button id="hit">模拟受击 −18%</button><button id="restore">恢复满血</button><button id="background" aria-pressed="false">切换暗色背景</button></div>
<section class="stage" id="stage" aria-label="战斗背景中的血条预览"><div class="hero-bar"><canvas id="hero" width="720" height="112" aria-label="当前神兽血条"></canvas></div><div class="sprite" id="sprite" role="img"></div><div class="floor-shadow"></div><span class="stage-label">战斗画面 · 血条居中置顶，名称贴近槽体</span></section>
<div class="caption"><strong id="theme"></strong><span>受击后浅色残量短暂追赶；只有凤王显示半血技能刻度。</span></div>
<section class="grid" id="grid" aria-label="九只神兽的血条设计"></section>
<p class="foot">点击任一血条放大查看。桌面与手机共用同一套紧凑排布；预览保持静音。</p>
</main><script>
const bosses=[
{id:'MEWTWO',name:'超梦',title:'超能次元',motif:'精神菱晶 · 双层悬浮节点',c:'#ad83df',light:'#ead5ff',dark:'#51375d',kind:'psychic'},
{id:'LUGIA',name:'洛奇亚',title:'海神之翼',motif:'银白翼尖 · 海蓝流纹',c:'#65b9d5',light:'#e0faff',dark:'#375b74',kind:'wing'},
{id:'HOOH',name:'凤王',title:'虹色之翼',motif:'三层金羽 · 虹色羽根',c:'#e4a548',light:'#fff1b0',dark:'#774331',kind:'feather'},
{id:'RAYQUAZA',name:'烈空坐',title:'天空之柱',motif:'盘龙端部 · 金色纹节',c:'#60b581',light:'#ccf5a7',dark:'#2a5849',kind:'dragon'},
{id:'KYOGRE',name:'盖欧卡',title:'海之霸主',motif:'宽鳍轮廓 · 红色海纹',c:'#599bd4',light:'#c3ecff',dark:'#304d79',kind:'fin'},
{id:'GROUDON',name:'固拉多',title:'大地之主',motif:'黑岩尖甲 · 熔岩裂隙',c:'#d46c4c',light:'#ffd89e',dark:'#543a38',kind:'rock'},
{id:'DIALGA',name:'帝牙卢卡',title:'时间之龙',motif:'钢甲阶边 · 时间钻石',c:'#6db7c8',light:'#dafbff',dark:'#3a536e',kind:'steel'},
{id:'PALKIA',name:'帕路奇亚',title:'空间之龙',motif:'珍珠节点 · 错位空间轨',c:'#bc8dbd',light:'#ffe0ef',dark:'#674a71',kind:'pearl'},
{id:'ARCEUS',name:'阿尔宙斯',title:'创世之神',motif:'金轮弧端 · 四点创世纹',c:'#cbb064',light:'#fff6d0',dark:'#75613a',kind:'ring'}
];
let selected=bosses[2],hp=68,trail=68,dark=false,last=0,hitAt=0;
const images=new Map();for(const b of bosses){const im=new Image();im.src='../../assets/icons/'+b.id+'.png';images.set(b.id,im);const o=document.createElement('option');o.value=b.id;o.textContent=b.name;document.querySelector('#boss').append(o);}
const canvases=new Map();for(const b of bosses){const button=document.createElement('button');button.className='sample';button.setAttribute('aria-label','查看'+b.name+'血条');const can=document.createElement('canvas');can.width=720;can.height=112;const p=document.createElement('div');p.className='motif';p.textContent=b.motif;button.append(can,p);button.onclick=()=>choose(b);document.querySelector('#grid').append(button);canvases.set(b.id,{can,button});}
function choose(b){selected=b;document.querySelector('#boss').value=b.id;document.querySelector('#theme').textContent=b.name+' / '+b.motif;const s=document.querySelector('#sprite');s.style.backgroundImage=`url('../../assets/icons/${b.id}.png')`;s.setAttribute('aria-label',b.name+'像素精灵');for(const [id,v] of canvases){v.button.classList.toggle('selected',id===b.id);v.button.setAttribute('aria-pressed',String(id===b.id));}}
function setHp(v){hp=Math.max(0,Math.min(100,v));document.querySelector('#hp').value=hp;document.querySelector('#pct').textContent=hp+'%';if(trail<hp)trail=hp;hitAt=performance.now();}
function pixel(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function diamond(ctx,x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();ctx.fill();}
function end(ctx,b,right){ctx.save();ctx.translate(right?337:23,40);ctx.scale(right?-1:1,1);const P=(x,y,w,h,c)=>pixel(ctx,x,y,w,h,c);const D=b.dark,L=b.light,C=b.c;
 switch(b.kind){
 case 'feather':for(let i=0;i<3;i++){const y=-11+i*8;P(-16+i*3,y,20-i*3,3,D);P(-14+i*3,y+3,22-i*3,3,C);P(-8+i*3,y+6,15-i*3,2,L);}P(0,-5,3,10,'#85a264');P(3,-3,2,6,'#bd5d60');break;
 case 'wing':for(let i=0;i<3;i++){P(-17+i*5,-9+i*6,20-i*3,3,D);P(-14+i*5,-6+i*6,19-i*3,3,'#c6dfdf');P(-9+i*5,-3+i*6,14-i*3,2,L);}break;
 case 'dragon':P(-15,-9,16,4,D);P(-18,-5,6,12,D);P(-15,7,16,4,D);P(-12,-6,14,3,C);P(-15,-3,5,8,C);P(-12,5,14,3,C);P(-11,-4,3,9,'#dac26c');P(-7,-2,4,5,D);break;
 case 'fin':P(-16,-5,21,10,D);P(-21,-10,8,4,D);P(-21,6,8,4,D);P(-17,-7,8,14,C);P(-11,-3,14,6,C);P(-17,-5,3,3,'#dc7270');P(-14,2,8,2,'#dc7270');P(-12,-2,7,2,L);break;
 case 'rock':for(let i=0;i<3;i++){P(-16+i*6,-8-(i%2)*4,6,16+(i%2)*8,D);P(-14+i*6,-5,3,10,C);P(-14+i*6,-2,2,3,L);}P(-18,-1,22,2,D);break;
 case 'steel':P(-16,-6,6,12,D);P(-10,-11,7,22,D);P(-3,-7,8,14,D);P(-13,-3,4,6,C);P(-7,-8,4,16,'#a4c6d2');P(-1,-4,5,8,L);diamond(ctx,-5,0,4,C);break;
 case 'pearl':P(-17,-7,12,14,D);P(-19,-3,16,6,D);P(-14,-5,8,10,C);P(-16,-2,12,4,C);P(-12,-3,5,5,L);P(-2,-10,10,2,C);P(-2,8,10,2,L);break;
 case 'ring':P(-17,-7,4,14,D);P(-13,-11,12,4,D);P(-13,7,12,4,D);P(-1,-7,4,14,D);P(-14,-6,3,12,C);P(-11,-8,8,3,C);P(-11,5,8,3,C);P(-2,-6,3,12,C);P(-18,-1,22,2,L);P(-8,-13,2,26,L);break;
 default:diamond(ctx,-9,0,10,D);diamond(ctx,-9,0,7,C);diamond(ctx,-9,0,3,L);diamond(ctx,5,-9,3,C);diamond(ctx,5,9,3,C);
 }ctx.restore();}
function draw(canvas,b,time){const ctx=canvas.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,360,56);ctx.imageSmoothingEnabled=false;const ink=dark?'#f4eee1':'#39424b',muted=dark?'#bec8d6':'#82857c';const im=images.get(b.id);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,im.naturalWidth/2,im.naturalHeight,3,1,27,27);ctx.font='12px Fusion, sans-serif';ctx.fillStyle=ink;ctx.fillText(b.name,35,14);ctx.font='8px Fusion, sans-serif';ctx.fillStyle=muted;ctx.fillText(b.title,35,25);ctx.textAlign='right';ctx.font='10px Fusion, sans-serif';ctx.fillStyle=ink;ctx.fillText(hp+'%',337,20);ctx.textAlign='left';
 const x=27,y=35,w=306,h=10;pixel(ctx,x-3,y-2,w+6,h+4,b.dark);pixel(ctx,x-1,y-3,w+2,1,b.dark);pixel(ctx,x,y-1,w,1,dark?'#8594ac':'#c5cbcc');pixel(ctx,x,y,w,h,dark?'#1f293a':'#d4d9d6');const tw=Math.round(w*trail/100),fw=Math.round(w*hp/100);if(tw>fw)pixel(ctx,x+fw,y,tw-fw,h,'#efdabb');if(fw){pixel(ctx,x,y,fw,h,b.c);pixel(ctx,x,y,fw,2,b.light);pixel(ctx,x,y+h-2,fw,2,b.dark);for(let sx=x+11;sx<x+fw-3;sx+=18){if(b.kind==='dragon'){pixel(ctx,sx,y+3,5,1,'#d7d084');pixel(ctx,sx+4,y+3,1,4,'#d7d084');}else if(b.kind==='rock'){pixel(ctx,sx,y+2,1,3,b.dark);pixel(ctx,sx+1,y+4,3,1,b.dark);}else if(b.kind==='fin'){pixel(ctx,sx,y+4,7,1,b.light);}else if(b.kind==='steel')pixel(ctx,sx,y+2,1,6,'#d5f1f455');}
 const glint=x+((time/6000)%1)*fw;ctx.save();ctx.beginPath();ctx.rect(x,y,fw,h);ctx.clip();pixel(ctx,glint,y,2,h,b.light+'66');ctx.restore();}
 end(ctx,b,false);end(ctx,b,true);if(b.kind==='feather'){diamond(ctx,x+w*.5,y+h*.5,4,b.dark);diamond(ctx,x+w*.5,y+h*.5,2,b.light);if(hp<=50){ctx.fillStyle=muted;ctx.font='8px Fusion, sans-serif';ctx.textAlign='right';ctx.fillText('半血 · 神圣羽暴',337,55);ctx.textAlign='left';}}
 if(b.kind==='steel'){diamond(ctx,180,31,5,b.dark);diamond(ctx,180,31,3,b.light);}if(b.kind==='ring'){for(const sx of [103,180,257])pixel(ctx,sx,32,3,1,b.c);}if(b.kind==='pearl'){pixel(ctx,95,32,40,1,b.light);pixel(ctx,238,48,30,1,b.c);}
}
function animate(time){const dt=Math.min(.1,(time-last)/1000);last=time;if(time-hitAt>220)trail+= (hp-trail)*(1-Math.exp(-dt*6));if(Math.abs(trail-hp)<.1)trail=hp;draw(document.querySelector('#hero'),selected,time);for(const [id,v] of canvases)draw(v.can,bosses.find(b=>b.id===id),time);requestAnimationFrame(animate);}
document.querySelector('#boss').onchange=e=>choose(bosses.find(b=>b.id===e.target.value));document.querySelector('#hp').oninput=e=>setHp(Number(e.target.value));document.querySelector('#hit').onclick=()=>setHp(hp-18);document.querySelector('#restore').onclick=()=>setHp(100);document.querySelector('#background').onclick=()=>{dark=!dark;document.querySelector('#stage').classList.toggle('dark',dark);for(const v of canvases.values())v.button.classList.toggle('dark',dark);const btn=document.querySelector('#background');btn.textContent=dark?'切换亮色背景':'切换暗色背景';btn.setAttribute('aria-pressed',String(dark));};choose(selected);document.fonts.ready.then(()=>requestAnimationFrame(animate));
</script></body></html>
