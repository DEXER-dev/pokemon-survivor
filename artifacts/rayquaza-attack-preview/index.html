<body>
  <main class="shell">
    <header class="header"><div class="brand"><div class="sigil">✦</div><div><div class="eyebrow">Legendary Boss · Attack Showcase</div><h1>裂空座 · 苍天攻势</h1></div></div><div class="badge">天空之柱顶层 · 攻击演出预览</div></header>
    <section class="main">
      <div class="stage"><canvas id="scene" width="1200" height="675" aria-label="裂空座BOSS攻击演出"></canvas><div class="stage-hud"><div class="hud-chip">BOSS阶段 <strong id="hudPhase">Ⅰ · 试探</strong></div><div class="hud-chip">攻击演出 <strong id="hudMove">准备中</strong></div></div><div class="boss-hp"><div class="boss-name">裂空座　·　天空之柱守护者</div><div class="hp-track"><div class="hp-fill"></div></div></div><div class="hint" id="hint">蓄力预警 · 看准落点间隙再躲避</div></div>
      <div class="toolbar"><div class="moves" role="group" aria-label="选择攻击"><button class="move" data-move="0" aria-pressed="true">① 天穹俯冲</button><button class="move" data-move="1" aria-pressed="false">② 苍天十字</button><button class="move" data-move="2" aria-pressed="false">③ 绿辉流星雨</button></div><div class="actions"><div class="phase-switch" role="group" aria-label="攻击阶段"><button data-phase="1" aria-pressed="true">一阶段</button><button data-phase="2" aria-pressed="false">二阶段</button></div><button class="action primary" id="play">↻ 重播</button><button class="action" id="pause" aria-pressed="false">Ⅱ 暂停</button></div></div>
      <div class="readout"><div><h2 id="moveTitle">天穹俯冲 · 画龙点睛</h2><p id="moveDesc">裂空座锁定训练家后蓄力，化作翠绿流星沿直线俯冲。长条预警会覆盖冲刺路线，横向闪避即可脱离。</p></div><div class="phase-label" id="phaseLabel">蓄力 → 俯冲 → 冲击收束</div></div><div class="timeline"><span id="progress"></span></div>
      <div class="footer"><span class="desktop-note">自动循环播放 · 可切换攻击与阶段 · 预警形状对应游戏内命中区域</span><span class="mobile-note">点选招式与阶段 · 点击重播</span><strong>裂空座专属演出</strong></div>
    </section>
  </main>
  <script>
    (()=>{
      const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),W=1200,H=675;
      ctx.imageSmoothingEnabled=false;
      const bg=new Image(),rayImg=new Image(),trainerImg=new Image();
      bg.src='../rayquaza-sky-pillar-concept/assets/sky-pillar-arena-base-clean-v2.png';rayImg.src='../../assets/icons/RAYQUAZA.png';trainerImg.src='../../assets/player/NPC_198_Lucas.png';
      const moveNames=['天穹俯冲 · 画龙点睛','龙尾回旋 · 苍天十字','苍天裂界 · 绿辉流星雨'];
      const descriptions=[
        '裂空座锁定训练家后蓄力，化作翠绿流星沿直线俯冲。长条预警会覆盖冲刺路线，横向闪避即可脱离。',
        '裂空座高速切入并挥出龙尾，先后扫过互相垂直的两条路径；二阶段追加斜向回扫，留意交错的安全空档。',
        '裂空座升至高空凝聚绿辉，数颗流星依次砸向分散落点。注意逐个扩张的落地标记，穿过落点之间的空隙。'
      ];
      const sequence=['蓄力 → 俯冲 → 冲击收束','龙尾切入 → 十字扫击 → 残影散去','天穹蓄能 → 流星坠落 → 绿辉消散'];
      let move=0,phase=1,time=0,last=performance.now(),paused=false;
      const total=5.2,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
      const title=document.getElementById('moveTitle'),desc=document.getElementById('moveDesc'),seq=document.getElementById('phaseLabel'),hint=document.getElementById('hint'),bar=document.getElementById('progress'),hudMove=document.getElementById('hudMove'),hudPhase=document.getElementById('hudPhase');
      function sync(){title.textContent=moveNames[move];desc.textContent=descriptions[move];seq.textContent=sequence[move];hudMove.textContent=['俯冲','十字扫击','流星雨'][move];hudPhase.textContent=phase===1?'Ⅰ · 试探':'Ⅱ · 全力';document.querySelectorAll('.move').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.move===move)));document.querySelectorAll('.phase-switch button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.phase===phase)));time=0;}
      function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
      function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
      function glow(x,y,r,color,alpha=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,.42*alpha));g.addColorStop(.42,rgba(color,.16*alpha));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
      function star(x,y,r,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.2,-r*.2);ctx.lineTo(r,0);ctx.lineTo(r*.2,r*.2);ctx.lineTo(0,r);ctx.lineTo(-r*.2,r*.2);ctx.lineTo(-r,0);ctx.lineTo(-r*.2,-r*.2);ctx.closePath();ctx.fill();ctx.restore();}
      function ray(x,y,size=80,angle=0,alpha=1,frame=0){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);if(rayImg.complete&&rayImg.naturalWidth>0){ctx.drawImage(rayImg,frame*64,0,64,64,-size/2,-size/2,size,size)}else{glow(0,0,size,'#41e9a2ALPHA',alpha);ctx.fillStyle='#20a97b';ctx.beginPath();ctx.ellipse(0,0,size*.44,size*.16,0,0,Math.PI*2);ctx.fill()}ctx.restore();}
      function trainer(x,y){ctx.save();if(trainerImg.complete&&trainerImg.naturalWidth>0){ctx.drawImage(trainerImg,0,0,48,48,x-24,y-28,48,48)}else{ctx.fillStyle='#f1ad57';ctx.fillRect(x-8,y-14,16,25);ctx.fillStyle='#e95749';ctx.fillRect(x-10,y-21,20,9)}ctx.restore()}
      function dangerRect(x,y,len,w,a,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=`rgba(32,237,151,${alpha*.17})`;ctx.strokeStyle=`rgba(145,255,196,${alpha*.9})`;ctx.lineWidth=2;ctx.setLineDash([10,7]);ctx.fillRect(-len/2,-w/2,len,w);ctx.strokeRect(-len/2,-w/2,len,w);ctx.setLineDash([]);for(let xx=-len/2+12;xx<len/2;xx+=31){ctx.fillStyle=`rgba(136,255,192,${alpha*.38})`;ctx.fillRect(xx,-1,13,2)}ctx.restore();}
      function dangerCircle(x,y,r,alpha){ctx.save();ctx.fillStyle=`rgba(255,190,92,${alpha*.17})`;ctx.strokeStyle=`rgba(255,220,149,${alpha*.94})`;ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=`rgba(255,245,203,${alpha*.8})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r*.67,0,Math.PI*2);ctx.stroke();ctx.restore();}
      function spark(x,y,r,color,alpha){ctx.globalAlpha=alpha;star(x,y,r,color,Math.sin(time*7+x)*.7);ctx.globalAlpha=1;}
      function beam(x1,y1,x2,y2,width,alpha=1){ctx.save();ctx.globalCompositeOperation='screen';ctx.lineCap='round';const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'rgba(28,223,137,0)');g.addColorStop(.2,`rgba(49,246,155,${.72*alpha})`);g.addColorStop(.5,`rgba(226,255,235,${.98*alpha})`);g.addColorStop(.8,`rgba(62,251,165,${.8*alpha})`);g.addColorStop(1,'rgba(28,223,137,0)');ctx.strokeStyle=g;ctx.shadowColor='#57ffad';ctx.shadowBlur=23;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=`rgba(245,255,245,${.75*alpha})`;ctx.lineWidth=Math.max(2,width*.24);ctx.stroke();ctx.restore();}
      function shockwave(x,y,p,color='#eafff1',scale=1){if(p<=0||p>=1)return;ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<3;i++){const q=clamp(p*1.65-i*.19);if(q<=0)continue;ctx.globalAlpha=(1-q)*.82;ctx.strokeStyle=i===0?color:'#77ffba';ctx.lineWidth=i===0?3:2;ctx.beginPath();ctx.ellipse(x,y,16+q*156*scale,8+q*75*scale,-.12,0,Math.PI*2);ctx.stroke()}ctx.restore();}
      function chargeVortex(x,y,now,p){glow(x,y,158+26*p,'#54f5a5ALPHA',.38+.35*p);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<5;i++){const a=now*.0014+i*Math.PI*2/5,r=148-p*45,ex=x+Math.cos(a)*r,ey=y+Math.sin(a)*r*.62;const g=ctx.createLinearGradient(ex,ey,x,y);g.addColorStop(0,'rgba(52,232,148,0)');g.addColorStop(.58,`rgba(91,255,180,${.43+.2*p})`);g.addColorStop(1,`rgba(235,255,238,${.56+.26*p})`);ctx.strokeStyle=g;ctx.lineWidth=4+i%2*2;ctx.shadowColor='#72ffc0';ctx.shadowBlur=13;ctx.beginPath();ctx.moveTo(ex,ey);ctx.bezierCurveTo(x+Math.cos(a+1.2)*r*.8,y+Math.sin(a+1.2)*r*.52,x+Math.cos(a+2.4)*r*.35,y+Math.sin(a+2.4)*r*.32,x+Math.cos(a+3.1)*16,y+Math.sin(a+3.1)*12);ctx.stroke()}ctx.restore();for(let i=0;i<24;i++){const a=now*.0018+i*Math.PI*2/24,r=150-p*56+Math.sin(now*.004+i)*8;star(x+Math.cos(a)*r,y+Math.sin(a)*r*.68,2.3+(i%4===0?2:0),i%3?'#caffdf':'#fff5c6',.55+.35*Math.sin(now*.005+i))}}
      function meteor(x,y,size,angle,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=alpha;ctx.globalCompositeOperation='screen';const g=ctx.createLinearGradient(-size*2,0,size*.6,0);g.addColorStop(0,'rgba(70,255,170,0)');g.addColorStop(.62,'rgba(69,247,158,.45)');g.addColorStop(1,'rgba(236,255,238,.96)');ctx.fillStyle=g;ctx.shadowColor='#55ffad';ctx.shadowBlur=size*.6;ctx.beginPath();ctx.moveTo(-size*2,-size*.16);ctx.lineTo(size*.22,-size*.27);ctx.lineTo(size*.52,0);ctx.lineTo(size*.22,size*.27);ctx.lineTo(-size*2,size*.16);ctx.closePath();ctx.fill();ctx.fillStyle='#f3fff0';ctx.beginPath();ctx.ellipse(size*.25,0,size*.43,size*.3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8affbc';ctx.beginPath();ctx.ellipse(size*.25,0,size*.25,size*.18,0,0,Math.PI*2);ctx.fill();ctx.restore()}
      function drawScene(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){time+=dt;if(time>=total)time%=total;}const t=time,totalP=time/total,warning=clamp(time/2.45),impact=clamp((time-2.45)/1.15),after=clamp((time-3.6)/1.6);bar.style.width=`${totalP*100}%`;
        hint.textContent=time<2.45?'蓄力预警 · 看准落点间隙再躲避':time<3.6?'攻击命中 · 闪光与冲击波':'余辉收束 · 下一轮攻击即将开始';
        ctx.save();let shake=0;if(time>=2.45&&time<2.83)shake=(1-(time-2.45)/.38)*10;if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
        if(bg.complete&&bg.naturalWidth){const scale=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),bw=bg.naturalWidth*scale,bh=bg.naturalHeight*scale;ctx.drawImage(bg,(W-bw)/2,(H-bh)/2,bw,bh)}else{ctx.fillStyle='#335783';ctx.fillRect(0,0,W,H)}
        ctx.fillStyle='rgba(9,22,43,.23)';ctx.fillRect(0,0,W,H);const target={x:474,y:376},origin={x:835,y:165};const dx=target.x-origin.x,dy=target.y-origin.y,distance=Math.hypot(dx,dy)||1,ux=dx/distance,uy=dy/distance,nx=-uy,ny=ux,aimAngle=Math.atan2(dy,dx),advance=Math.min(550,Math.max(112,distance-25)),strike={x:origin.x+ux*advance,y:origin.y+uy*advance};
        // stage light, slow dust and rings
        const ambient=ctx.createRadialGradient(615,230,30,615,230,440);ambient.addColorStop(0,'rgba(116,255,190,.14)');ambient.addColorStop(1,'rgba(70,145,170,0)');ctx.fillStyle=ambient;ctx.fillRect(0,0,W,H);
        for(let i=0;i<19;i++){const x=(i*167+Math.sin(now/2700+i)*19)%W,y=(i*109+now/52%H)%H;ctx.globalAlpha=.2+.18*Math.sin(now/800+i);star(x,y,1.3+(i%3)*.4,'#d0f4db',Math.sin(now/1000+i));}ctx.globalAlpha=1;
        // Defensive player marker and unobtrusive safe-space cue.
        const dodge=ease((time-2.24)/.34),playerX=target.x+nx*72*dodge,playerY=target.y+ny*72*dodge;ctx.fillStyle='rgba(187,238,220,.15)';ctx.beginPath();ctx.ellipse(playerX,playerY+21,42,12,0,0,Math.PI*2);ctx.fill();trainer(playerX,playerY);
        if(time<2.45)chargeVortex(origin.x,origin.y,now,warning);
        if(move===0){
          const angle=aimAngle,tx=strike.x,ty=strike.y;
          if(time<2.45){const pulse=.92+.08*Math.sin(now/90);dangerRect((origin.x+tx)/2,(origin.y+ty)/2,560,phase===2?112:86,angle,.35+warning*.65);glow(origin.x,origin.y,105,'#51f2a4ALPHA',.55+warning*.45);ray(origin.x,origin.y,82*pulse,angle+.25*Math.sin(now/230),.94,0);for(let i=0;i<9;i++){let a=now/580+i*Math.PI*2/9,r=110-warning*49;star(origin.x+Math.cos(a)*r,origin.y+Math.sin(a)*r,3.5,i%2?'#d7ffe4':'#68f7b0',.9)}ctx.strokeStyle='rgba(165,255,211,.5)';ctx.lineWidth=2;ctx.setLineDash([4,9]);ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([])}
          else{const p=ease(impact);const x=origin.x+(tx-origin.x)*p,y=origin.y+(ty-origin.y)*p+Math.sin(p*Math.PI)*-28;for(let g=5;g>0;g--){const q=clamp(p-g*.105);ray(origin.x+(tx-origin.x)*q,origin.y+(ty-origin.y)*q+Math.sin(q*Math.PI)*-28,76-g*7,angle,.18+g*.065,0)}beam(origin.x,origin.y,x,y,52,1);glow(x,y,100+impact*95,'#50f7a4ALPHA',1-impact*.35);ray(x,y,106,angle,.98,0);shockwave(x,y,clamp((time-2.43)/.83));if(time<2.88){const q=clamp((time-2.45)/.43);ctx.fillStyle=`rgba(232,255,241,${.22*(1-q)})`;ctx.fillRect(0,0,W,H)}}
        }else if(move===1){
          const sweepAngle=aimAngle+.42,angles=[sweepAngle,sweepAngle+Math.PI/2];if(phase===2)angles.push(sweepAngle+.72,sweepAngle-.72);
          const cx=strike.x,cy=strike.y;
